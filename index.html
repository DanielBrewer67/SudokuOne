<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <header id="header">
      <div class="header-left">
        <span class="logo">⬛</span>
        <h1>Sudoku</h1>
      </div>
      <nav class="header-nav">
        <button id="btn-stats" class="btn-ghost">Stats</button>
        <button id="btn-new-game" class="btn-primary">New Game</button>
      </nav>
    </header>

    <main id="game-panel">

      <div id="info-bar">
        <span id="difficulty-badge" class="difficulty-badge">Medium</span>
        <span id="timer" class="timer">00:00</span>
        <span id="error-count" class="error-count"></span>
        <span id="progress" class="progress-text">0 / 45</span>
      </div>

      <div id="progress-bar">
        <div id="progress-bar-fill"></div>
      </div>

      <div id="board" role="grid" aria-label="Sudoku board"></div>

      <div id="controls">
        <button id="btn-pencil" class="control-btn" aria-pressed="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Notes
        </button>
        <button id="btn-erase" class="control-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Erase
        </button>
        <button id="btn-undo" class="control-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
          Undo
        </button>
        <button id="btn-hint" class="control-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Hint
        </button>
        <button id="btn-auto" class="control-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Auto
        </button>
      </div>

      <div id="numpad" role="group" aria-label="Number pad"></div>

    </main>

    <section id="stats-panel" hidden>
      <div class="stats-header">
        <h2>Your Stats</h2>
      </div>
      <div id="stats-content"></div>
    </section>

    <dialog id="new-game-modal" aria-labelledby="modal-title">
      <div class="modal-inner">
        <h2 id="modal-title">Choose Difficulty</h2>
        <p class="modal-subtitle">Select a difficulty level to start a new game</p>
        <div id="difficulty-buttons">
          <button data-difficulty="easy" class="diff-btn">
            <span class="diff-name">Easy</span>
            <span class="diff-desc">38 clues — great for beginners</span>
          </button>
          <button data-difficulty="medium" class="diff-btn">
            <span class="diff-name">Medium</span>
            <span class="diff-desc">29 clues — comfortable challenge</span>
          </button>
          <button data-difficulty="hard" class="diff-btn">
            <span class="diff-name">Hard</span>
            <span class="diff-desc">24 clues — for experienced players</span>
          </button>
          <button data-difficulty="expert" class="diff-btn">
            <span class="diff-name">Expert</span>
            <span class="diff-desc">18 clues — test your limits</span>
          </button>
        </div>
        <button id="modal-cancel" class="btn-ghost modal-cancel">Cancel</button>
      </div>
    </dialog>

    <div id="win-overlay" hidden>
      <div id="win-card">
        <div class="win-icon">🎉</div>
        <h2>Puzzle Complete!</h2>
        <div class="win-stats">
          <div class="win-stat">
            <span class="win-stat-label">Difficulty</span>
            <span id="win-difficulty" class="win-stat-value"></span>
          </div>
          <div class="win-stat">
            <span class="win-stat-label">Time</span>
            <span id="win-time" class="win-stat-value"></span>
          </div>
          <div class="win-stat">
            <span class="win-stat-label">Result</span>
            <span id="win-errors" class="win-stat-value"></span>
          </div>
        </div>
        <button id="win-new-game" class="btn-primary btn-large">Play Again</button>
      </div>
    </div>

    <div id="loading-overlay" hidden>
      <div class="spinner"></div>
      <p>Fetching puzzle…</p>
    </div>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
